<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Martinez Knight</title>
    <!-- GitHub Pages serves this for any unknown path (e.g. a hard refresh
         on /martinez-knight/about). It repackages the path into a query
         string and redirects to index.html, which decodes it back —
         standard fix for SPA routing on GitHub Pages
         (github.com/rafgraph/spa-github-pages). -->
    <script>
      var pathSegmentsToKeep = 1; // keep the /martinez-knight/ repo segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
